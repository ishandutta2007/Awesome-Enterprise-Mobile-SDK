<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes waveScan {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(1300px); opacity: 0; }
      }
      .glow-orb-1 {
        transform-origin: 250px 120px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .glow-orb-2 {
        transform-origin: 950px 240px;
        animation: pulseGlow 9s ease-in-out infinite 1.5s;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .data-beam {
        stroke-dasharray: 20, 180;
        animation: beamFlow 6s linear infinite;
      }
      .scan-line {
        animation: waveScan 10s ease-in-out infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Border Frame -->
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Dynamic Ambient Glow Spheres (Layer 0: Deep Background) -->
  <circle cx="240" cy="110" r="180" fill="url(#accentGlow)" class="glow-orb-1"/>
  <circle cx="960" cy="250" r="210" fill="#6366f1" opacity="0.18" class="glow-orb-2"/>
  <circle cx="600" cy="190" r="260" fill="#0ea5e9" opacity="0.08"/>

  <!-- Subtle Circuit & Tech Grid Lines (Layer 1: Background Infrastructure) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1100" y1="0" x2="1100" y2="380"/>
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
  </g>

  <!-- Dynamic Connecting Network Nodes & Circuit Traces (Layer 2) -->
  <g fill="none" opacity="0.75">
    <!-- Curved Enterprise Highway -->
    <path d="M 50,330 C 300,330 400,280 600,280 C 800,280 900,330 1150,330" stroke="#334155" stroke-width="2"/>
    <path d="M 50,330 C 300,330 400,280 600,280 C 800,280 900,330 1150,330" stroke="#38bdf8" stroke-width="2.5" class="data-beam"/>

    <!-- Upper Infrastructure Rail -->
    <path d="M 80,60 C 350,60 450,110 600,110 C 750,110 850,60 1120,60" stroke="#1e293b" stroke-width="2"/>
    <path d="M 80,60 C 350,60 450,110 600,110 C 750,110 850,60 1120,60" stroke="#818cf8" stroke-width="2" class="data-beam" style="animation-delay: -3s;"/>
  </g>

  <!-- Network Connection Nodes with Pulse Animation -->
  <g>
    <circle cx="200" cy="315" r="4" fill="#38bdf8"/>
    <circle cx="200" cy="315" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="4;14;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1000" cy="315" r="4" fill="#a855f7"/>
    <circle cx="1000" cy="315" r="8" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="4;14;4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mobile Device Geometry Outline (Layer 3: Aesthetic Accents, Right Side) -->
  <g transform="translate(1020, 75)" opacity="0.25">
    <rect x="0" y="0" width="110" height="210" rx="18" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <line x1="38" y1="12" x2="72" y2="12" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <rect x="10" y="28" width="90" height="152" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>
    <circle cx="55" cy="195" r="5" fill="#94a3b8"/>
  </g>

  <!-- Mobile Device Geometry Outline (Layer 3: Aesthetic Accents, Left Side) -->
  <g transform="translate(70, 95)" opacity="0.22">
    <rect x="0" y="0" width="100" height="190" rx="16" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <line x1="35" y1="10" x2="65" y2="10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="8" y="24" width="84" height="140" rx="6" fill="none" stroke="#475569" stroke-width="1.5"/>
    <circle cx="50" cy="177" r="4" fill="#94a3b8"/>
  </g>

  <!-- MAIN FOREGROUND CONTENT (Guaranteed Unobscured & Fully Legible) -->
  <g transform="translate(600, 0)" text-anchor="middle" filter="url(#dropShadow)">
    
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 56)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
      <text y="4" fill="#38bdf8" class="pill-text" letter-spacing="0.08em">⚡ ENTERPRISE MOBILE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="132" class="text-title" font-size="52" fill="#FFFFFF">
      Awesome Enterprise Mobile SDK
    </text>

    <!-- Gradient Accent Underline Bar -->
    <rect x="-240" y="152" width="480" height="4" rx="2" fill="url(#primaryTextGrad)"/>

    <!-- Subtitle -->
    <text y="196" class="text-subtitle" font-size="20" fill="#E2E8F0">
      Curated Catalog of Production-Ready Mobile SDKs, Cloud MBaaS &amp; Native Frameworks
    </text>

    <!-- Context Highlight Line -->
    <text y="230" class="text-subtitle" font-size="15" fill="#94A3B8">
      Cross-Platform Runtimes • Enterprise Cloud Services • Offline Data Sync • VoIP &amp; Chat Infrastructure
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 288)">
      <!-- Pill 1: Cross-Platform -->
      <g transform="translate(-360, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
        <text y="5" fill="#7dd3fc" class="pill-text">📱 Cross-Platform</text>
      </g>
      <!-- Pill 2: Cloud MBaaS -->
      <g transform="translate(-180, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
        <text y="5" fill="#a5b4fc" class="pill-text">☁️ Cloud MBaaS</text>
      </g>
      <!-- Pill 3: Offline-First -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
        <text y="5" fill="#e9d5ff" class="pill-text">🔄 Offline-First Sync</text>
      </g>
      <!-- Pill 4: Real-Time VoIP & Chat -->
      <g transform="translate(185, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
        <text y="5" fill="#6ee7b7" class="pill-text">💬 Real-Time Comms</text>
      </g>
      <!-- Pill 5: Enterprise Security -->
      <g transform="translate(365, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="1.2"/>
        <text y="5" fill="#fbcfe8" class="pill-text">🛡️ Security &amp; Auth</text>
      </g>
    </g>

  </g>
</svg>
